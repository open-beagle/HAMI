kind: pipeline
name: dev

trigger:
  branch:
    - dev

volumes:
  - name: docker
    host:
      path: /var/run/docker.sock

clone:
  disable: true

steps:
  - name: fetch
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-git:1.0
    settings:
      proxy:
        from_secret: SOCKS5_PROXY

  - name: build
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/cuda:12.6.3-devel-ubuntu24.04
    environment:
      BUILD_VERSION: v2.6.1-beagle
    commands:
      - sh .beagle/build.sh

  - name: docker-amd64
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-docker:1.0
    volumes:
      - name: docker
        path: /var/run/docker.sock
    settings:
      base: registry-vpc.cn-qingdao.aliyuncs.com/wod/cuda:12.6.3-runtime-ubuntu22.04
      dockerfile: .beagle/dockerfile
      repo: wod/hami
      Version: "v2.6.1-beagle"
      channel: amd64
      args: "TARGETOS=linux,TARGETARCH=amd64"
      registry: registry-vpc.cn-qingdao.aliyuncs.com
      registry_user:
        from_secret: REGISTRY_USER_ALIYUN
      registry_password:
        from_secret: REGISTRY_PASSWORD_ALIYUN

  - name: docker-arm64
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-docker:1.0
    volumes:
      - name: docker
        path: /var/run/docker.sock
    settings:
      base: registry-vpc.cn-qingdao.aliyuncs.com/wod/ubuntu:22.04-arm64
      dockerfile: .beagle/dockerfile_arm64
      repo: wod/hami
      Version: "v2.6.1-beagle"
      channel: arm64
      args: "TARGETOS=linux,TARGETARCH=arm64"
      registry: registry-vpc.cn-qingdao.aliyuncs.com
      registry_user:
        from_secret: REGISTRY_USER_ALIYUN
      registry_password:
        from_secret: REGISTRY_PASSWORD_ALIYUN

  - name: docker-arch
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-docker-manifest:1.0
    settings:
      platforms: linux/amd64,linux/arm64
      template: registry-vpc.cn-qingdao.aliyuncs.com/wod/hami:v2.6.1-beagle-ARCH
      target: registry-vpc.cn-qingdao.aliyuncs.com/wod/hami:v2.6.1-beagle
      username:
        from_secret: REGISTRY_USER_ALIYUN
      password:
        from_secret: REGISTRY_PASSWORD_ALIYUN
---
clone:
  disable: true

trigger:
  branch:
    - main

kind: pipeline
name: main
steps:
  - name: harbor-amd64
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-docker-tag:1.0
    environment:
      REGISTRY_USER:
        from_secret: REGISTRY_USER_ALIYUN
      REGISTRY_PASSWORD:
        from_secret: REGISTRY_PASSWORD_ALIYUN
    settings:
      source: registry-vpc.cn-qingdao.aliyuncs.com/wod/hami:v2.6.1-beagle-amd64
      target: registry-vpc.cn-qingdao.aliyuncs.com/wod/hami:v2.6-beagle-amd64
      registry: registry-vpc.cn-qingdao.aliyuncs.com

  - name: harbor-arm64
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-docker-tag:1.0
    environment:
      REGISTRY_USER:
        from_secret: REGISTRY_USER_ALIYUN
      REGISTRY_PASSWORD:
        from_secret: REGISTRY_PASSWORD_ALIYUN
    settings:
      source: registry-vpc.cn-qingdao.aliyuncs.com/wod/hami:v2.6.1-beagle-arm64
      target: registry-vpc.cn-qingdao.aliyuncs.com/wod/hami:v2.6-beagle-arm64
      registry: registry-vpc.cn-qingdao.aliyuncs.com

  - name: harbor-arch
    image: registry-vpc.cn-qingdao.aliyuncs.com/wod/devops-docker-manifest:1.0
    settings:
      platforms: linux/amd64,linux/arm64
      template: registry-vpc.cn-qingdao.aliyuncs.com/wod/hami:v2.6-beagle-ARCH
      target: registry-vpc.cn-qingdao.aliyuncs.com/wod/hami:v2.6-beagle
      username:
        from_secret: REGISTRY_USER_ALIYUN
      password:
        from_secret: REGISTRY_PASSWORD_ALIYUN
---
kind: secret
name: SOCKS5_PROXY
get:
  name: SOCKS5_PROXY
  path: devops-secrets

---
kind: secret
name: REGISTRY_USER_ALIYUN
get:
  name: REGISTRY_USER_ALIYUN
  path: devops-secrets

---
kind: secret
name: REGISTRY_PASSWORD_ALIYUN
get:
  name: REGISTRY_PASSWORD_ALIYUN
  path: devops-secrets

---
kind: secret
name: S3_ACCESS_KEY_ALIYUN
get:
  name: S3_ACCESS_KEY_ALIYUN
  path: devops-secrets

---
kind: secret
name: S3_SECRET_KEY_ALIYUN
get:
  name: S3_SECRET_KEY_ALIYUN
  path: devops-secrets
