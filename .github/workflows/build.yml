name: Build Images

on:
  push:
    branches:
      - main

env:
  BUILD_VERSION: v2.6.1

jobs:
  build:
    name: Build Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Cross Build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/go/src/github.com/Project-HAMi/HAMi \
            -w /go/src/github.com/Project-HAMi/HAMi \
            -e BUILD_VERSION=${{ env.BUILD_VERSION }} \
            registry.cn-qingdao.aliyuncs.com/wod/golang:1.24 \
            bash .beagle/build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images for amd64 - hami
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .beagle/dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-beagle-amd64
            registry.cn-qingdao.aliyuncs.com/wod/hami:${{ env.BUILD_VERSION }}-beagle-amd64
          build-args: |
            BASE=ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-amd64
            VERSION=${{ env.BUILD_VERSION }}
          provenance: false
          sbom: false

      - name: Build and push images for arm64 - hami
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .beagle/dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-beagle-arm64
            registry.cn-qingdao.aliyuncs.com/wod/hami:${{ env.BUILD_VERSION }}-beagle-arm64
          build-args: |
            BASE=ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-arm64
            VERSION=${{ env.BUILD_VERSION }}
          provenance: false
          sbom: false

      - name: Create and push multi-arch manifest - hami
        run: |
          docker manifest create ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-beagle \
            ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-beagle-amd64 \
            ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-beagle-arm64
          docker manifest push ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-beagle

          docker manifest create registry.cn-qingdao.aliyuncs.com/wod/hami:${{ env.BUILD_VERSION }}-beagle \
            registry.cn-qingdao.aliyuncs.com/wod/hami:${{ env.BUILD_VERSION }}-beagle-amd64 \
            registry.cn-qingdao.aliyuncs.com/wod/hami:${{ env.BUILD_VERSION }}-beagle-arm64
          docker manifest push registry.cn-qingdao.aliyuncs.com/wod/hami:${{ env.BUILD_VERSION }}-beagle
