name: Main Code Check

on:
  push:
    branches:
      - main

env:
  BUILD_VERSION: v2.6.2

jobs:
  check:
    name: Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Main branch note
        run: |
          echo "main only tracks source changes for HAMi ${BUILD_VERSION}."
          echo "Use scheduler to build scheduler images: hami:${BUILD_VERSION}-amd64 and hami:${BUILD_VERSION}-arm64."
          echo "Use build-cuda to build the NVIDIA CUDA plugin image: hami:${BUILD_VERSION}-cuda."
          echo "Use ascend-device-plugin/.beagle.yml to publish the Ascend/CANN plugin image: hami:${BUILD_VERSION}-cann."
