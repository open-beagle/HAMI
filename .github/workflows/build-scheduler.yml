name: Build Scheduler Images

on:
  push:
    branches:
      - scheduler

env:
  BUILD_VERSION: v2.6.2
  AMD64_BUILDER_IMAGE: registry.cn-qingdao.aliyuncs.com/wod/golang:1.24
  ARM64_BUILDER_IMAGE: registry.cn-qingdao.aliyuncs.com/wod/golang:1.24

jobs:
  build-scheduler:
    name: Build Scheduler Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Cross Build - scheduler amd64
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/go/src/github.com/Project-HAMi/HAMi \
            -w /go/src/github.com/Project-HAMi/HAMi \
            -e BUILD_VERSION=${{ env.BUILD_VERSION }} \
            -e BUILD_TARGET=scheduler-amd64 \
            ${{ env.AMD64_BUILDER_IMAGE }} \
            bash .beagle/build.sh

      - name: Cross Build - scheduler arm64
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/go/src/github.com/Project-HAMi/HAMi \
            -w /go/src/github.com/Project-HAMi/HAMi \
            -e BUILD_VERSION=${{ env.BUILD_VERSION }} \
            -e BUILD_TARGET=scheduler-arm64 \
            ${{ env.ARM64_BUILDER_IMAGE }} \
            bash .beagle/build.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push scheduler amd64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .beagle/hami-scheduler.dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-amd64
            registry.cn-qingdao.aliyuncs.com/wod/hami:${{ env.BUILD_VERSION }}-amd64
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
            TARGETOS=linux
            TARGETARCH=amd64
          provenance: false
          sbom: false

      - name: Build and push scheduler arm64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .beagle/hami-scheduler.dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-arm64
            registry.cn-qingdao.aliyuncs.com/wod/hami:${{ env.BUILD_VERSION }}-arm64
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
            TARGETOS=linux
            TARGETARCH=arm64
          provenance: false
          sbom: false
