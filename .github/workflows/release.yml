name: Verify Release Images

on:
  push:
    branches:
      - release-v2.6.2

env:
  BUILD_VERSION: v2.6.2

jobs:
  verify-images:
    name: Verify Final Image Tags
    runs-on: ubuntu-latest
    steps:
      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Aliyun image tags
        run: |
          docker buildx imagetools inspect registry.cn-qingdao.aliyuncs.com/wod/hami:${{ env.BUILD_VERSION }}-amd64
          docker buildx imagetools inspect registry.cn-qingdao.aliyuncs.com/wod/hami:${{ env.BUILD_VERSION }}-arm64
          docker buildx imagetools inspect registry.cn-qingdao.aliyuncs.com/wod/hami:${{ env.BUILD_VERSION }}-cuda
          docker buildx imagetools inspect registry.cn-qingdao.aliyuncs.com/wod/hami:${{ env.BUILD_VERSION }}-cann

      - name: Verify GHCR image tags
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-amd64
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-arm64
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/hami:${{ env.BUILD_VERSION }}-cuda
