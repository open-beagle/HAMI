name: Build HAMi CUDA 12.4 Builder

on:
  push:
    branches:
      - build-cuda-builder
  workflow_dispatch:

env:
  GO_VERSION: 1.24.10

jobs:
  build:
    name: Build HAMi CUDA 12.4 Builder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push HAMi CUDA 12.4 builder
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .beagle/hami-builder-cuda124.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/hami:cuda124-builder
            registry.cn-qingdao.aliyuncs.com/wod/hami:cuda124-builder
          build-args: |
            BASE=nvidia/cuda:12.4.1-devel-ubuntu22.04
            GO_VERSION=${{ env.GO_VERSION }}
          provenance: false
          sbom: false

      - name: Image push success
        run: echo "HAMi CUDA 12.4 builder pushed successfully"
